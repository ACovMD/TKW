<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Kept Woman</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Jost', sans-serif;
    background: #FFFFFF;
    color: #1A1610;
    font-weight: 300;
  }

  a { text-decoration: none; color: inherit; }

  /* ── NAV ── */
  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(6px);
  }

  .nav-inner {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    max-width: 1400px;
    margin: 0 auto;
    padding: 10px 40px;
  }

  .nav-left {
    display: flex;
    gap: 36px;
  }

  .nav-left a {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #1A1610;
    transition: opacity 0.2s;
  }
  .nav-left a:hover { opacity: 0.55; }

  .logo {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .logo img { height: 78px; width: auto; display: block; margin: 0 auto; }

  .nav-right {
    display: flex;
    justify-content: flex-end;
    gap: 30px;
  }

  .nav-right a, .nav-right button {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #1A1610;
    background: none;
    border: none;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .nav-right a:hover, .nav-right button:hover { opacity: 0.55; }

  .nav-toggle {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
  }
  .nav-toggle span {
    width: 22px;
    height: 1px;
    background: #1A1610;
  }

  /* ── BRAND TITLE ── */
  .brand-title {
    text-align: center;
    padding: 118px 20px 32px;
  }

  .brand-title h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: clamp(40px, 6vw, 76px);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #1A1610;
  }

  /* ── HERO ── */
  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 640px;
    overflow: hidden;
  }

  .hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Placeholder gradient shown until a real image is uploaded */
  .hero-placeholder {
    width: 100%;
    height: 100%;
    background: linear-gradient(160deg, #F3EFE8 0%, #E4DCCB 55%, #D3C7AE 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero-placeholder span {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-style: italic;
    color: rgba(26,22,16,0.28);
    letter-spacing: 0.05em;
  }

  .hero-caption {
    position: absolute;
    left: 40px;
    bottom: 48px;
    z-index: 2;
  }

  .hero-caption p {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #FFFFFF;
    margin-bottom: 14px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.25);
  }

  .hero-caption a {
    display: inline-block;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #1A1610;
    background: #FFFFFF;
    padding: 14px 34px;
    transition: opacity 0.2s;
  }
  .hero-caption a:hover { opacity: 0.85; }

  /* ── FOOTER ── */
  footer {
    padding: 60px 40px 40px;
    text-align: center;
    border-top: 1px solid #EFEBE3;
  }

  footer .footer-links {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  footer .footer-links a {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #6B6459;
    transition: color 0.2s;
  }
  footer .footer-links a:hover { color: #1A1610; }

  footer p {
    font-size: 10px;
    color: #A8A196;
    letter-spacing: 0.06em;
  }

  /* ── MOBILE ── */
  @media (max-width: 768px) {
    .nav-left { display: none; }
    .nav-toggle { display: flex; }
    .nav-inner { grid-template-columns: auto 1fr auto; padding: 10px 20px; }
    .logo img { height: 54px; }
    .brand-title { padding: 92px 20px 22px; }
    .nav-right a:not(.cart-link) { display: none; }
    .hero-caption { left: 20px; bottom: 32px; }
  }
</style>
</head>
<body>

<header>
  <div class="nav-inner">
    <nav class="nav-left">
      <a href="/shop">Shop</a>
      <a href="/contact">Contact Us</a>
      <a href="/faqs">FAQs</a>
    </nav>

    <a href="/" class="logo">
      <img src="logo.png" alt="The Kept Women — Always Confident">
    </a>

    <div class="nav-right">
      <a href="/account">Account</a>
      <a href="/cart" class="cart-link">Cart (0)</a>
      <button class="nav-toggle" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<section class="brand-title">
  <h1>The Kept Women</h1>
</section>

<section class="hero">
  <img src="hero.png" alt="The Kept Woman — backless gown, Atlanta skyline">

  <div class="hero-caption">
    <a href="/shop">Shop Now</a>
  </div>
</section>

<footer>
  <div class="footer-links">
    <a href="/shop">Shop</a>
    <a href="/contact">Contact Us</a>
    <a href="/faqs">FAQs</a>
    <a href="https://instagram.com/thekeptwomen" target="_blank" rel="noopener">Instagram</a>
    <a href="https://tiktok.com/@thekeptwomen" target="_blank" rel="noopener">TikTok</a>
  </div>
  <p>&copy; 2026 The Kept Women, LLC &middot; Atlanta, Georgia</p>
</footer>

</body>
</html>
